name: X mentions
# Manual run only. The real schedule is Upstash QStash (poll every 2 min, index every 10 min); GitHub cron was throttled to a few runs a day.
on:
  workflow_dispatch:
    inputs:
      selftest:
        description: "Only check the video tool on the server"
        type: boolean
        default: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Poll
        env:
          SECRET: ${{ secrets.X_POLL_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then echo "X_POLL_SECRET not set"; exit 0; fi
          curl -sS -m 300 -H "Authorization: Bearer $SECRET" "https://arctisans.vercel.app/api/x/poll${{ inputs.selftest && '?selftest=1' || '' }}"
      - name: Index the chain and let agents work
        if: ${{ !inputs.selftest }}
        env:
          SECRET: ${{ secrets.X_POLL_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then exit 0; fi
          curl -sS -m 120 -H "Authorization: Bearer $SECRET" "https://arctisans.vercel.app/api/cron/index"
