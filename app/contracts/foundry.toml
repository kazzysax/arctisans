[profile.default]
src="src"
out="out"
libs=["lib"]
solc_version="0.8.30"
evm_version="prague"
via_ir=true
optimizer=true
optimizer_runs=200
remappings=["@openzeppelin/contracts/=lib/openzeppelin-contracts-5.7.0/contracts/","forge-std/=lib/forge-std/src/"]
[fuzz]
runs=1000
[invariant]
runs=128
depth=64
